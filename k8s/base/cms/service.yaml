apiVersion: v1
kind: Service
metadata:
  name: realestate-cms-svc
  namespace: realestate
  labels:
    project: realestate
    app: realestate-cms
    env: local
spec:
  type: LoadBalancer
  # on which PODs will work - to load balance the traffic
  selector:
    app: realestate-cms
  ports:
    - name      : http
      protocol  : TCP
      port      : 3333 # Port on load balancer
      targetPort: 80   # Port on POD
