apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: realestate-mongo
  labels:
    app: realestate-mongo
spec:
  # StatefulSet preferes headless-service (f. ex., realestate-mongo-0.realestate-mongo-headless)
  serviceName: realestate-mongo-headless

  replicas: 
  selector:
    matchLabels:
      app: realestate-mongo

  template:
    metadata:
      labels:
        # label on pod (d-uh..). Services and selectors will look for pods with this name/label
        app: realestate-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongo
              containerPort: 27017
          # listen not only localhost
          args:
            - "--bind_ip_all"
              
          envFrom:
            - secretRef:
                name: realestate-mongo-secrets
                
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
            
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 6
            
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          volumeMounts:
            - name: mongo-data
              mountPath: /data/db

      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: realestate-mongo-pvc
