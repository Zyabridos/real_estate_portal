apiVersion: apps/v1
kind      : Deployment
metadata:
  name  : realestate-api
  namespace: realestate
  labels:
    project: realestate
    app    : realestate-api
    env    : local
    owner  : NinaZyabrina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realestate-api
# how will pods look like:
  template:
    metadata:
      labels:
        project: realestate
        app    : realestate-api
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MongoDB at realestate-mongo:27017...";
              until nc -z realestate-mongo 27017; do
                sleep 2;
              done;
              echo "Mongo is ready. Poceeding to backend container."
      containers:
        - name: api
          image: zyabridos/real_estate_prod_backend:latest
          ports:
            - name: http
              containerPort: 5000
          
          envFrom:
            - configMapRef:
                name: realestate-api-config
            - secretRef:
                name: realestate-api-secrets
          
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 6
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: autoscaling/v2
kind      : HorizontalPodAutoscaler
metadata:
  name  : realestate-api-hpa
  namespace: realestate
  labels:
    project: realestate
    app    : realestate-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind      : Deployment
    name      : realestate-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name  : cpu
        target:
          type              : Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name  : memory
        target:
          type              : Utilization
          averageUtilization: 80
