apiVersion: apps/v1
kind      : Deployment
metadata:
  name: realestate-api
  labels:
    app: realestate-api
spec:
  replicas: 1 # base default (overlays can override)
  # Selector defines which Pods belong to this Deployment (so, it MUST match template.metadata.labels)
  selector:
    matchLabels:
      app: realestate-api
  # Pod template = "how the Pods will look like"
  template:
    metadata:
      labels:
        app: realestate-api
    spec:
      containers:
        - name: api
          image: zyabridos/real_estate_prod_backend:latest
          # imagePullPolicy: IfNotPresent - do not need it, but nice to remember that this feature exists
          ports:
            - name: http
              containerPort: 5000
          
          envFrom:
            - configMapRef:
                name: realestate-api-config # non-secret config
            - secretRef:
                name: realestate-api-secrets # generated by Ansible
          
          readinessProbe:
            httpGet:
              path: /api/health/readiness
              port: 5000
            initialDelaySeconds: 5
            periodSeconds      : 10
            timeoutSeconds     : 2
            failureThreshold   : 6
          
          livenessProbe:
            httpGet:
              path: /api/health/liveness
              port: 5000
            initialDelaySeconds: 15
            periodSeconds      : 15
            timeoutSeconds     : 2
            failureThreshold   : 6
          
          resources:
            requests:
              # Requests = minimum needed to run
              cpu   : "100m"
              memory: "128Mi"
              # Limits = hard cap
            limits:
              cpu   : "500m"
              memory: "512Mi"
