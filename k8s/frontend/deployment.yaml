apiVersion: apps/v1
kind      : Deployment
metadata:
  name  : realestate-frontend
  labels:
    project: realestate # Service will look for those PODs labels!
    app    : realestate-frontend
    env    : local
    owner  : NinaZyabrina
spec:
  replicas: 1
  selector:
    matchLabels:
      app  : realestate-frontend
# how will pods look like:
  template:
    metadata:
      labels:
        project: realestate
        app    : realestate-frontend
    spec:
      # frontend is proxying to itself, so lets use nginx
      volumes:
        - name: nginx-config
          configMap:
            name: realestate-frontend-nginx
            items:
              - key: default.conf
                path: default.conf

      containers:
        - name : frontend
          image: zyabridos/real_estate_prod_frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name         : http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
---
apiVersion: autoscaling/v2
kind      : HorizontalPodAutoscaler
metadata:
  name  : realestate-frontend-hpa
  labels:
    project: realestate
    app    : realestate-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind      : Deployment
    name      : realestate-frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type    : Resource
      resource:
        name  : cpu
        target:
          type              : Utilization
          averageUtilization: 80
    - type    : Resource
      resource:
        name  : memory
        target:
          type              : Utilization
          averageUtilization: 80
