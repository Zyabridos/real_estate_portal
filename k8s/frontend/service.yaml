apiVersion: v1
kind      : Service
metadata:
  name  : realestate-frontend-svc
  labels:
    project: realestate
    app    : realestate-frontend
    env    : local
spec:
  type: LoadBalancer
  # on which PODs will work - to load balance the traffic
  selector:
    app: realestate-frontend # selecting PODs with these labels
  ports:
    - name      : http
      protocol  : TCP
      port      : 3000 # Port on load balancer
      targetPort: 80   # Port on POD