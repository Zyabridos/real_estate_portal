apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      project: realestate
      env: local
      app.kubernetes.io/part-of: realestate-portal
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/instance: dev

commonAnnotations:
  owner: NinaZyabrina
  
replicas:
  - name: realestate-api
    count: 2
  - name: realestate-frontend
    count: 2
  - name: realestate-cms
    count: 1
  - name: realestate-mongo
    count: 1
