apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realestate-ingress
  namespace: realestate
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.realestateproject.casa
        - cms.realestateproject.casa
      secretName: realestate-tls
  rules:
    - host: www.realestateproject.casa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realestate-frontend-svc
                port:
                  number: 80

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: realestate-api-svc
                port:
                  number: 5000

    - host: cms.realestateproject.casa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realestate-cms-svc
                port:
                  number: 80
