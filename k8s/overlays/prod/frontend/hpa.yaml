apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realestate-frontend-hpa
  labels:
    app: realestate-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realestate-frontend
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
