apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realestate-cms-hpa
  labels:
    app: realestate-cms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realestate-cms
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
