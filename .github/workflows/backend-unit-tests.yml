name: backend-unit-tests

on:
  workflow_call: {}
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: backend-backend-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            backend/**/packages.lock.json
            backend/**/*.csproj

      - name: Restore
        run: dotnet restore ./RealEstate.slnx

      - name: Build
        run: dotnet build ./RealEstate.slnx --configuration Release --no-restore

      - name: Test (unit)
        run: |
            dotnet test ./RealEstate.Tests/Validation/Validation.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=validation_test_results.trx"
            dotnet test ./RealEstate.Tests/Infrastructure/Infrastructure.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=infrastructure_test_results.trx"
            dotnet test ./RealEstate.Tests/Normalizers/Normalizers.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=infrastructure_test_results.trx"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx
