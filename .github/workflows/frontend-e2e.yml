name: Frontend E2E (Playwright)

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend-e2e.yml"
  push:
    branches:
      - '**'
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend-e2e.yml"
  workflow_dispatch:

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
        
      - name: Install e2e deps
        working-directory: frontend/tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend/tests/e2e
        run: npx playwright install --with-deps

      - name: Create .env for compose
        run: |
          cat > .env.ci << 'EOF'
          MONGO_DATABASE=${{ secrets.MONGO_DATABASE }}
          MONGO_ROOT_USERNAME=${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_PORT=${{ secrets.MONGO_PORT }}
          PING_PROPERTIES=${{ secrets.PING_PROPERTIES }}
          EOF
          
      - name: Start services (docker compose)
        run: docker compose --env-file .env.ci up -d --build

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5055/api/health > /dev/null; then
              echo "Backend is healthy"; exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"; docker compose --env-file .env.ci logs --no-color; exit 1

      - name: Seed database
        run: |
          chmod +x scripts/bash/seed/*.sh
          BACKEND_PORT=5055 BACKEND_URL=http://localhost:5055 make seed

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "Frontend is up"; exit 0
            fi
            sleep 2
          done
          echo "Frontend check failed"; docker compose --env-file .env.ci logs --no-color; exit 1

      - name: Run Playwright tests
        working-directory: frontend/tests/e2e
        env:
          E2E_BASE_URL: "http://localhost:3000"
          VITE_API_BASE_URL: "http://localhost:5055"
          CI: "true"
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/tests/e2e/playwright-report
            frontend/tests/e2e/test-results
          retention-days: 7

      - name: Docker compose logs (on failure)
        if: failure()
        run: |
          docker compose --env-file .env.ci logs --no-color \
            | sed -E 's/(MONGO_ROOT_PASSWORD=)[^ ]+/\1***REDACTED***/g' \
            | sed -E 's/(MONGO_ROOT_USERNAME=)[^ ]+/\1***REDACTED***/g' \
            | sed -E 's/(MONGO_DATABASE=)[^ ]+/\1***REDACTED***/g' \
            | sed -E 's/(MONGO_PORT=)[^ ]+/\1***REDACTED***/g'
      
      - name: Shutdown services
        if: always()
        run: docker compose --env-file .env.ci down -v
