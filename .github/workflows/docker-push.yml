name: Push Docker image (after tests)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: docker-push-after-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend_unit:
    name: backend-unit-tests
    uses: ./.github/workflows/backend-unit-tests.yml
    secrets: inherit

  backend_integration:
    name: backend-integration-tests
    uses: ./.github/workflows/backend-integration-tests.yml
    secrets: inherit

  frontend_unit:
    name: frontend-unit
    uses: ./.github/workflows/frontend-unit.yml
    secrets: inherit

  frontend_checks:
    name: frontend-checks
    uses: ./.github/workflows/frontend-types-checks.yml
    secrets: inherit

  frontend_e2e:
    name: frontend-e2e
    uses: ./.github/workflows/frontend-e2e.yml
    secrets: inherit

  docker_push:
    name: Build & push Docker images to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - backend_unit
      - backend_integration
      - frontend_unit
      - frontend_checks
      - frontend_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: zyabridos/real_estate_prod_backend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Docker meta (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: zyabridos/real_estate_prod_frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.production
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          build-args: |
            VITE_API_ORIGIN=
            VITE_API_PREFIX=/api
            VITE_SANITY_PROJECT_ID=${{ secrets.VITE_SANITY_PROJECT_ID }}
            VITE_SANITY_DATASET=${{ secrets.VITE_SANITY_DATASET }}
            VITE_SANITY_API_VERSION=2025-01-01
            VITE_SANITY_USE_CDN=true

      - name: Docker meta (cms)
        id: meta_cms
        uses: docker/metadata-action@v5
        with:
          images: zyabridos/real_estate_prod_cms
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build & push CMS
        uses: docker/build-push-action@v5
        with:
          context: ./cms
          file: ./cms/Dockerfile
          push: true
          tags: ${{ steps.meta_cms.outputs.tags }}
          labels: ${{ steps.meta_cms.outputs.labels }}