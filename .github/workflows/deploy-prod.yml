name: Deploy to production (blue/green)

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Target stack to deploy"
        required: true
        type: choice
        options:
          - blue
          - green
  
  # push:
  #   branches: [ "main" ]

env:
  FRONTEND_URL: https://realestateproject.casa
  BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
  TF_DIR: infrastructure/terraform
  ANSIBLE_DIR: infrastructure/ansible

jobs:
  deploy:
    runs-on: ubuntu-latest

    # In order for two deploys not going n the same stack parallel
    concurrency:
      group: prod-${{ github.event.inputs.stack || 'blue' }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set target stack vars
        id: vars
        run: |
          STACK="${{ github.event.inputs.stack }}"
          if [ -z "$STACK" ]; then
            STACK="blue"
          fi

          echo "stack=$STACK" >> $GITHUB_OUTPUT
          echo "workspace=prod-$STACK" >> $GITHUB_OUTPUT
          echo "varfile=terraform.prod.$STACK.tfvars" >> $GITHUB_OUTPUT

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Configure SSH key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_realestateproject
          chmod 600 ~/.ssh/hetzner_realestateproject

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform init -input=false

      - name: Select Terraform workspace (blue/green)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          terraform workspace select "${{ steps.vars.outputs.workspace }}" \
            || terraform workspace new "${{ steps.vars.outputs.workspace }}"

      - name: Terraform apply (target stack)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform apply -input=false -auto-approve -var-file="${{ steps.vars.outputs.varfile }}"

      - name: Export Ansible inventory from Terraform output
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          terraform output -raw ansible_inventory_ini > ../ansible/inventory.generated.ini
          echo "Generated inventory:"
          cat ../ansible/inventory.generated.ini

      - name: Run Ansible deploy (target stack)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/hetzner_realestateproject
          ANSIBLE_REMOTE_USER: ${{ secrets.SSH_USER }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          echo "$ANSIBLE_VAULT_PASSWORD" > vault_pass.txt
          chmod 600 vault_pass.txt

          ansible-playbook -i inventory.generated.ini playbook.yml \
          --vault-password-file vault_pass.txt \
          -e "stack_id=${{ steps.vars.outputs.stack }}"  
  
      - name: Wait for services to start
        run: sleep 60

      - name: Health check backend (by IP)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          IP="$(terraform output -raw public_ip)"
          echo "Checking backend at http://$IP/health"
          curl -fsSL "http://$IP/health" > /dev/null
