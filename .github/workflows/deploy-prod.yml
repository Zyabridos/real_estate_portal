name: Deploy prod (green, then blue) via Ansible

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  ANSIBLE_DIR: infrastructure/ansible
  ANSIBLE_INVENTORY_GREEN: inventory.prod-green.ini
  ANSIBLE_INVENTORY_BLUE: inventory.prod-blue.ini

jobs:
  deploy_green:
    name: Deploy GREEN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_realestateproject
          chmod 600 ~/.ssh/hetzner_realestateproject
          
      - name: debug - show SSH agent keys (fingerprints only)
        run: |
          set -euo pipefail
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
          echo "Loaded keys (fingerprints):"
          ssh-add -L | ssh-keygen -lf - || true
          echo "Loaded keys (short list):"
          ssh-add -l || true

      - name: debug - extract GREEN host from inventory
        id: green_host
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          set -euo pipefail
          INV="${{ env.ANSIBLE_INVENTORY }}"
          echo "Inventory file: $INV"
          test -f "$INV" || (echo "Inventory not found: $INV" && exit 1)

          # Get first host line under [realestate_prod_green]
          GREEN_HOST="$(
            awk '
              /^\[realestate_prod_green\]/ {in=1; next}
              /^\[/ {in=0}
              in && $1 !~ /^#/ && $1 != "" {print $1; exit}
            ' "$INV"
          )"

          test -n "$GREEN_HOST" || (echo "Could not find GREEN host under [realestate_prod_green] in $INV" && exit 1)
          echo "GREEN_HOST=$GREEN_HOST"
          echo "GREEN_HOST=$GREEN_HOST" >> "$GITHUB_OUTPUT"

      - name: debug - SSH test to GREEN (publickey only)
        run: |
          set -euo pipefail
          HOST="${{ steps.green_host.outputs.GREEN_HOST }}"
          echo "Testing SSH to root@$HOST using agent key..."

          ssh -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              -o PubkeyAuthentication=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              root@"$HOST" 'echo "SSH OK: $(hostname)"; id' || {
                echo "SSH FAILED. This usually means: wrong key, root login disabled, or authorized_keys mismatch."
                exit 1
              }

      - name: debug - Ansible ping (GREEN, verbose)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=publickey -o IdentitiesOnly=yes"
        run: |
          ansible -i "${{ env.ANSIBLE_INVENTORY }}" realestate_prod_green -m ping -vvv

      - name: Install dependencies (rsync + python)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync python3-pip

      - name: Install Ansible + collection
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible>=9,<10"
          ansible-galaxy collection install ansible.posix

      - name: Write vault password file
        run: |
          mkdir -p "${{ env.ANSIBLE_DIR }}"
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "${{ env.ANSIBLE_DIR }}/vault-password"
          chmod 600 "${{ env.ANSIBLE_DIR }}/vault-password"

      - name: Ansible ping (GREEN)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ansible -i "${{ env.ANSIBLE_INVENTORY_GREEN }}" realestate_prod_green -m ping

      - name: Deploy (GREEN)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ansible-playbook -i "${{ env.ANSIBLE_INVENTORY_GREEN }}" playbook.yml \
            --limit realestate_prod_green \
            --vault-password-file vault-password \
            -e "env=prod stack_id=green"

      - name: Health check via Ansible (GREEN)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ansible -i "${{ env.ANSIBLE_INVENTORY_GREEN }}" realestate_prod_green \
            -m ansible.builtin.uri \
            -a "url=http://localhost/lb-health method=GET status_code=200 return_content=yes" \
            -b

  deploy_blue:
    name: Deploy BLUE
    runs-on: ubuntu-latest
    needs: [deploy_green]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_realestateproject
          chmod 600 ~/.ssh/hetzner_realestateproject

      - name: Install dependencies (rsync + python)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync python3-pip

      - name: Install Ansible + collection
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible>=9,<10"
          ansible-galaxy collection install ansible.posix

      - name: Write vault password file
        run: |
          mkdir -p "${{ env.ANSIBLE_DIR }}"
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "${{ env.ANSIBLE_DIR }}/vault-password"
          chmod 600 "${{ env.ANSIBLE_DIR }}/vault-password"

      - name: Ansible ping (BLUE)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ansible -i "${{ env.ANSIBLE_INVENTORY_BLUE }}" realestate_prod_blue -m ping

      - name: Deploy (BLUE)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ansible-playbook -i "${{ env.ANSIBLE_INVENTORY_BLUE }}" playbook.yml \
            --limit realestate_prod_blue \
            --vault-password-file vault-password \
            -e "env=prod stack_id=blue"

      - name: Health check via Ansible (BLUE)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        run: |
          ansible -i "${{ env.ANSIBLE_INVENTORY_BLUE }}" realestate_prod_blue \
            -m ansible.builtin.uri \
            -a "url=http://localhost/lb-health method=GET status_code=200 return_content=yes" \
            -b
