name: Deploy to production (blue/green)

on:
  push:
  workflow_dispatch:
    inputs:
      stack:
        description: "Target stack"
        required: true
        type: choice
        options: [blue, green, both]
        default: both

permissions:
  contents: read

env:
  ANSIBLE_DIR: infrastructure/ansible
  
jobs:
  # Smoke-test on all branches
  smoke:
    name: Smoke (non-main)
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hetzner API smoke (count LBs)
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y jq curl

          lbs="$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/load_balancers?label_selector=project%3Dreal-estate-hub%2Cenv%3Dprod")"

          total="$(echo "$lbs" | jq '.load_balancers | length')"
          blue="$(echo "$lbs" | jq '[.load_balancers[] | select(.labels.stack=="blue")] | length')"
          green="$(echo "$lbs" | jq '[.load_balancers[] | select(.labels.stack=="green")] | length')"

          echo "LB total=$total, blue=$blue, green=$green"
          test "$total" -eq 2
          test "$blue" -eq 1
          test "$green" -eq 1

  # Deploy on main or manual
  deploy:
    name: Deploy (main/manual) – ${{ matrix.stack }}
#    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stack: [blue, green]

    concurrency:
      group: prod-${{ matrix.stack }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Decide if this stack should run (manual selection)
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            req="${{ github.event.inputs.stack }}"
            if [ "$req" = "both" ] || [ "$req" = "${{ matrix.stack }}" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip stack (manual selection)
        if: steps.pick.outputs.run != 'true'
        run: echo "Skipping ${{ matrix.stack }}"

      - name: Ensure exactly 2 prod LBs exist (blue+green)
        if: steps.pick.outputs.run == 'true'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y jq curl

          lbs="$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/load_balancers?label_selector=project%3Dreal-estate-hub%2Cenv%3Dprod")"

          total="$(echo "$lbs" | jq '.load_balancers | length')"
          blue="$(echo "$lbs" | jq '[.load_balancers[] | select(.labels.stack=="blue")] | length')"
          green="$(echo "$lbs" | jq '[.load_balancers[] | select(.labels.stack=="green")] | length')"

          echo "LB total=$total, blue=$blue, green=$green"
          test "$total" -eq 2
          test "$blue" -eq 1
          test "$green" -eq 1

      - name: Install Ansible + rsync + jq/curl
        if: steps.pick.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y ansible rsync jq curl

      - name: Configure SSH key
        if: steps.pick.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_realestateproject
          chmod 600 ~/.ssh/hetzner_realestateproject

      - name: Generate inventory from Hetzner servers labels (stack=${{ matrix.stack }})
        if: steps.pick.outputs.run == 'true'
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail

          STACK="${{ matrix.stack }}"
          servers="$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/servers?label_selector=project%3Dreal-estate-hub%2Cenv%3Dprod%2Cstack%3D$STACK")"

          count="$(echo "$servers" | jq '.servers | length')"
          echo "Found $count servers for stack=$STACK"
          test "$count" -ge 1

          ip="$(echo "$servers" | jq -r '.servers[0].public_net.ipv4.ip')"
          test -n "$ip" && [ "$ip" != "null" ]

          inv="inventory.generated.$STACK.ini"
          cat > "$inv" <<EOF
          [realestate_prod_${STACK}]
          $ip ansible_user=${{ secrets.SSH_USER }}
          EOF

          echo "Inventory written: $inv"
          cat "$inv"

      - name: Run Ansible deploy (stack=${{ matrix.stack }})
        if: steps.pick.outputs.run == 'true'
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/hetzner_realestateproject
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          STACK="${{ matrix.stack }}"

          echo "$ANSIBLE_VAULT_PASSWORD" > vault_pass.txt
          chmod 600 vault_pass.txt

          ansible-playbook -i "inventory.generated.$STACK.ini" playbook.yml \
            --vault-password-file vault_pass.txt \
            -e "stack_id=$STACK"

      - name: LB health check (stack=${{ matrix.stack }})
        if: steps.pick.outputs.run == 'true'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          STACK="${{ matrix.stack }}"

          lbs="$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/load_balancers?label_selector=project%3Dreal-estate-hub%2Cenv%3Dprod%2Cstack%3D$STACK")"

          lb_ip="$(echo "$lbs" | jq -r '.load_balancers[0].public_net.ipv4.ip')"
          test -n "$lb_ip" && [ "$lb_ip" != "null" ]
          echo "LB IP ($STACK): $lb_ip"

          code="$(curl -sS -o /dev/null -w "%{http_code}" "http://$lb_ip/lb-health" -H "Host: realestateproject.casa")"
          echo "HTTP status: $code"
          test "$code" -eq 200
