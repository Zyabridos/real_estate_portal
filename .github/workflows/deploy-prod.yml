name: Deploy to production (blue/green)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      stack:
        description: "Target stack"
        required: true
        type: choice
        options: [ blue, green, both ]
        default: both

env:
  FRONTEND_URL: https://realestateproject.casa
  BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
  TF_DIR: infrastructure/terraform
  ANSIBLE_DIR: infrastructure/ansible

jobs:
  deploy_blue:
    if: github.event_name == 'push' || github.event.inputs.stack == 'blue' || github.event.inputs.stack == 'both'
    runs-on: ubuntu-latest
    concurrency:
      group: prod-blue
      cancel-in-progress: true

    env:
      TF_DIR: infrastructure/terraform
      ANSIBLE_DIR: infrastructure/ansible

    steps:
      - uses: actions/checkout@v4

      - name: ensure exactly 2 prod LBs exist (blue+green)
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          lbs="$(curl -sS -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/load_balancers?label_selector=project%3Dreal-estate-hub%2Cenv%3Dprod")"
          count="$(echo "$lbs" | jq '.load_balancers | length')"
          echo "Found $count load balancers (project=real-estate-hub, env=prod)"
          test "$count" -eq 2 || exit 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Configure SSH key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_realestateproject
          chmod 600 ~/.ssh/hetzner_realestateproject

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform init -input=false

      - name: Select workspace (prod-blue)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform workspace select prod-blue || terraform workspace new prod-blue

      - name: Terraform apply (blue)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform apply -auto-approve -var-file="terraform.prod.blue.tfvars"

      - name: Export inventory
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: terraform output -raw ansible_inventory_ini > ../ansible/inventory.generated.ini

      - name: Run Ansible deploy (blue)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/hetzner_realestateproject
          ANSIBLE_REMOTE_USER: ${{ secrets.SSH_USER }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          echo "$ANSIBLE_VAULT_PASSWORD" > vault_pass.txt
          chmod 600 vault_pass.txt
          ansible-playbook -i inventory.generated.ini playbook.yml \
            --vault-password-file vault_pass.txt \
            -e "stack_id=blue"

      - name: LB health-check through LB IP (blue)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          LB_IP="$(terraform output -raw load_balancer_ipv4)"
          echo "LB_IP=$LB_IP"
          curl -fsS "http://$LB_IP/lb-health" -H "Host: realestateproject.casa"

  deploy_green:
    if: github.event_name == 'push' || github.event.inputs.stack == 'green' || github.event.inputs.stack == 'both'
    runs-on: ubuntu-latest
    concurrency:
      group: prod-green
      cancel-in-progress: true
