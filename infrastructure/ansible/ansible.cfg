[defaults]
inventory = ./inventories/generated/prod-blue.ini
# ansible complained at soma point on not finding roles path ¯\_(ツ)_/¯
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False

callbacks_enabled = ansible.builtin.default
result_format = yaml

timeout = 60
forks = 20

[ssh_connection]
pipelining = True
