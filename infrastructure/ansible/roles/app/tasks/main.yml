---
- name: Ensure app directory exists on remote
  ansible.builtin.file:
    path: "{{ project_root_remote }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Sync project files to remote (excluding heavy stuff)
  ansible.posix.synchronize:
    src: "{{ project_root_local }}/"
    dest: "{{ project_root_remote }}/"
    delete: yes
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.github"
      - "--exclude=.turbo"
      - "--exclude=dist"
      - "--exclude=coverage"
      - "--exclude=playwright-report"
      - "--exclude=test-results"
      - "--exclude=node_modules"
      - "--exclude=frontend/node_modules"
      - "--exclude=cms/node_modules"
      - "--exclude=backend/bin"
      - "--exclude=backend/obj"
      - "--exclude=mongo_data"
      - "--exclude=**/.DS_Store"
  delegate_to: localhost
  become: false

- name: Render .env for production
  ansible.builtin.template:
    src: .env.production.j2
    dest: "{{ project_root_remote }}/.env"
    owner: root
    group: root
    mode: "0640"

- name: Pull/build and start stack
  ansible.builtin.command:
    chdir: "{{ project_root_remote }}"
    cmd: docker compose up -d --build
  register: compose_result
  changed_when: >
    'Creating' in compose_result.stdout
    or 'Recreating' in compose_result.stdout
    or 'Building' in compose_result.stdout
    or 'Pulling' in compose_result.stdout

- name: Show docker compose status
  ansible.builtin.command:
    chdir: "{{ project_root_remote }}"
    cmd: docker compose ps
  register: ps_result
  changed_when: false

- name: Print docker compose status
  ansible.builtin.debug:
    var: ps_result.stdout_lines
