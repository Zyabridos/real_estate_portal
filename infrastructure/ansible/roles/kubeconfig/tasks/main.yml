- name: Ensure local kube dir exists
  ansible.builtin.file:
    path: "{{ local_kube_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fetch kubeconfig from k3s server
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ local_kubeconfig_path }}"
    flat: true
  run_once: true

- name: Patch kubeconfig to use public API endpoint (instead of 127.0.0.1)
  ansible.builtin.replace:
    path: "{{ local_kubeconfig_path }}"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ inventory_hostname }}:{{ k3s_api_port | default(6443) }}"
  delegate_to: localhost
  become: false
  run_once: true
