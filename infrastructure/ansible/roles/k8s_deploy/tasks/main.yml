- name: Fail if image_tag is missing in prod
  ansible.builtin.fail:
    msg: >-
      Prod deploy requires immutable uniq tag.
      Please run: make deploy-app-blue IMAGE_TAG=sha-<gitsha> (or set IMAGE_TAG in Makefile)
  when:
    - env == "prod"
    - not ansible_check_mode
    - image_tag is not defined or (image_tag | string | trim) == ""

- name: Resolve deploy tag
  ansible.builtin.set_fact:
    deploy_tag: "{{ image_tag | default('latest') }}"
    api_image_expected: "zyabridos/real_estate_prod_backend:{{ image_tag | default('latest') }}"
    fe_image_expected:  "zyabridos/real_estate_prod_frontend:{{ image_tag | default('latest') }}"
    cms_image_expected: "zyabridos/real_estate_prod_cms:{{ image_tag | default('latest') }}"

- name: Check-mode summary (no kubectl apply/pin/verify)
  ansible.builtin.debug:
    msg:
      - "CHECK MODE: would apply overlay={{ k8s_overlay }}"
      - "CHECK MODE: would apply secrets for env={{ env }}"
      - "CHECK MODE: would pin API image={{ api_image_expected }}"
      - "CHECK MODE: would pin FE image={{ fe_image_expected }}"
      - "CHECK MODE: would pin CMS image={{ cms_image_expected }}"
  when: ansible_check_mode

- name: Apply Mongo secret
  no_log: true
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }} apply -f - <<'YAML'
    {{ lookup('ansible.builtin.file', repo_root + '/infrastructure/ansible/secrets/' + env + '/mongo-secret.vault.yaml') }}
    YAML
  args:
    executable: /bin/bash
  delegate_to: localhost
  when: not ansible_check_mode

- name: Apply API secret
  no_log: true
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }} apply -f - <<'YAML'
    {{ lookup('ansible.builtin.file', repo_root + '/infrastructure/ansible/secrets/' + env + '/api-secret.vault.yaml') }}
    YAML
  args:
    executable: /bin/bash
  delegate_to: localhost
  when: not ansible_check_mode

- name: Apply kustomize overlay
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }}
    apply -k {{ k8s_dir }}/{{ k8s_overlay }}
  delegate_to: localhost
  when: not ansible_check_mode

- name: Pin API image tag
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }}
    set image deployment/realestate-api
    api={{ api_image_expected }}
  delegate_to: localhost
  when: not ansible_check_mode

- name: Pin Frontend image tag
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }}
    set image deployment/realestate-frontend
    frontend={{ fe_image_expected }}
  delegate_to: localhost
  when: not ansible_check_mode

- name: Pin CMS image tag
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }}
    set image deployment/realestate-cms
    cms={{ cms_image_expected }}
  delegate_to: localhost
  when: not ansible_check_mode

- name: Wait for Mongo StatefulSet
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }}
    rollout status sts/realestate-mongo --timeout=300s
  changed_when: false
  delegate_to: localhost
  when: not ansible_check_mode