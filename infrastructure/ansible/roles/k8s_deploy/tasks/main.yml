- name: Apply kustomize overlay
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }}
    apply -k {{ k8s_dir }}/{{ k8s_overlay }}
  delegate_to: localhost

- name: Apply Mongo secret (vaulted yaml)
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }} apply -f - <<'YAML'
    {{ lookup('ansible.builtin.file', repo_root + '/infrastructure/ansible/secrets/prod/mongo-secret.vault.yaml') }}
    YAML
  args:
    executable: /bin/bash
  delegate_to: localhost
  register: mongo_secret_apply

- name: Apply API secret (vaulted yaml)
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }} apply -f - <<'YAML'
    {{ lookup('ansible.builtin.file', repo_root + '/infrastructure/ansible/secrets/prod/api-secret.vault.yaml') }}
    YAML
  args:
    executable: /bin/bash
  delegate_to: localhost
  register: api_secret_apply
  
- name: Wait for Mongo StatefulSet
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }}
    rollout status sts/realestate-mongo --timeout=300s
  changed_when: false
  delegate_to: localhost

- name: Wait for API deployment
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }}
    rollout status deploy/realestate-api --timeout=600s
  changed_when: false
  delegate_to: localhost

- name: Wait for Frontend deployment
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }}
    rollout status deploy/realestate-frontend --timeout=600s
  changed_when: false
  delegate_to: localhost

- name: Wait for CMS deployment
  ansible.builtin.command: >
    kubectl --kubeconfig {{ local_kubeconfig_path }} -n {{ k8s_namespace }}
    rollout status deploy/realestate-cms --timeout=600s
  changed_when: false
  delegate_to: localhost
